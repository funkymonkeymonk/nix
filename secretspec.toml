[project]
name = "devenv-machines"
revision = "1.0"

[providers]
homelab = "onepassword://Homelab"
personal = "onepassword://Personal"
megamanx = "onepassword://Private"

[profiles.Homelab]
OPNIX_SERVICE_ACCOUNT_TOKEN = { description = "1Password service-account token for opnix", ref = { item = "1Password Service Account - Opnix", field = "credential" }, providers = ["homelab"] }
TAILSCALE_OAUTH_CLIENT_ID = { description = "Tailscale OAuth client ID for one-time deployment auth keys", ref = { item = "Tailscale Oauth", field = "Client ID" }, providers = ["homelab"] }
TAILSCALE_OAUTH_CLIENT_SECRET = { description = "Tailscale OAuth client secret for one-time deployment auth keys", ref = { item = "Tailscale Oauth", field = "Client secret" }, providers = ["homelab"] }

[profiles.Homelab.defaults]
providers = ["homelab"]
inherit = false

[profiles.MegamanX]
MEGAMANX_SUDO_PASSWORD = { description = "MegamanX sudo password", ref = { item = "MegamanX Sudo Password", field = "password" }, providers = ["megamanx"] }

[profiles.MegamanX.defaults]
providers = ["megamanx"]
inherit = false
