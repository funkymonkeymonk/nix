---
name: PR Validation
# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
env:
  NIX_ACCESS_TOKENS: >-
    github.com=${{ github.token }} api.github.com=${{ github.token }}
    codeload.github.com=${{ github.token }}
permissions:
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Quick validation runs first - blocks builds if it fails
  lint:
    name: Quick Validation & Code Quality
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Install lint tools (pinned to flake.lock nixpkgs)
        run: |
          NIXPKGS_OWNER=$(jq -r '.nodes.nixpkgs.locked.owner' flake.lock)
          NIXPKGS_REPO=$(jq -r '.nodes.nixpkgs.locked.repo' flake.lock)
          NIXPKGS_REV=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          NIXPKGS="github:${NIXPKGS_OWNER}/${NIXPKGS_REPO}/${NIXPKGS_REV}"
          nix profile add --accept-flake-config \
            "$NIXPKGS#alejandra" \
            "$NIXPKGS#deadnix" \
            "$NIXPKGS#statix" \
            "$NIXPKGS#yamllint"
          DEVENV_REV=$(jq -r '.nodes.devenv.locked.rev' flake.lock)
          nix profile add --accept-flake-config "github:cachix/devenv/${DEVENV_REV}#devenv"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Run lint checks
        run: bash .github/scripts/lint.sh
      - name: Test CI workflow helpers
        if: needs.changes.outputs.ci-helper-files == 'true'
        run: |
          bash tests/test-ci-workflows.sh
          bash tests/test-ci-overlay-upstream-check.sh
          bash tests/test-ci-check-groups.sh
          bash tests/test-ci-change-selection.sh
          bash tests/test-ci-config-cache.sh
  # Check if Nix files changed (skip builds/tests if only docs changed)
  # Runs in parallel with lint since it only checks file paths
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      nix-files: ${{ steps.filter.outputs.nix-files }}
      workflows: ${{ steps.filter.outputs.workflows }}
      check-prefixes: ${{ steps.changed-checks.outputs.check-prefixes }}
      ci-helper-files: ${{ steps.filter.outputs.ci-helper-files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for Nix file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nix-files:
              - '**/*.nix'
              - 'flake.lock'
              - 'secretspec.toml'
            workflows:
              - '.github/workflows/**'
            ci-helper-files:
              - 'devenv.nix'
              - 'scripts/check-overlay-upstream-urls.sh'
              - 'scripts/overlay-source-urls.nix'
              - '.github/scripts/**'
              - '.github/workflows/**'
              - 'tests/test-ci-*.sh'
      - name: Select non-VM checks affected by changed files
        id: changed-checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | bash .github/scripts/select-pr-checks.sh > check-prefixes.json
          else
            printf '["*"]\n' > check-prefixes.json
          fi
          printf 'check-prefixes=%s\n' "$(<check-prefixes.json)" >> "$GITHUB_OUTPUT"
  # Discover what configurations exist and check if they need rebuilds
  discover-targets:
    name: Discover Build Targets
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: >
      ${{
        needs.changes.outputs.nix-files == 'true' ||
        needs.changes.outputs.workflows == 'true'
      }}
    outputs:
      darwin-configs: ${{ steps.discover.outputs.darwin-configs }}
      nixos-configs: ${{ steps.discover.outputs.nixos-configs }}
      darwin-count: ${{ steps.discover.outputs.darwin-count }}
      nixos-count: ${{ steps.discover.outputs.nixos-count }}
      darwin-changed: ${{ steps.check-changes.outputs.darwin-changed }}
      nixos-changed: ${{ steps.check-changes.outputs.nixos-changed }}
      nixos-arm-changed: ${{ steps.check-changes.outputs.nixos-arm-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      # Restore cached derivation hashes from previous runs
      - name: Restore derivation cache
        uses: actions/cache/restore@v4
        id: drv-cache
        with:
          path: .drv-cache
          key: drv-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            drv-${{ github.ref }}-
            drv-main-
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Discover configurations
        id: discover
        run: |
          echo "Discovering flake configurations..."
          mkdir -p .drv-cache
          # Get Darwin configurations
          DARWIN_CONFIGS=$(nix eval .#darwinConfigurations \
            --apply 'x: builtins.attrNames x' --json 2>/dev/null || echo '[]')
          DARWIN_COUNT=$(echo $DARWIN_CONFIGS | jq 'length')
          # Use multi-line syntax for JSON output
          echo "darwin-configs<<EOF" >> $GITHUB_OUTPUT
          echo "$DARWIN_CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "darwin-count=$DARWIN_COUNT" >> $GITHUB_OUTPUT
          echo "Darwin configurations ($DARWIN_COUNT): $DARWIN_CONFIGS"
          # Get NixOS configurations
          NIXOS_CONFIGS=$(nix eval .#nixosConfigurations \
            --apply 'x: builtins.attrNames x' --json 2>/dev/null || echo '[]')
          NIXOS_COUNT=$(echo $NIXOS_CONFIGS | jq 'length')
          # Use multi-line syntax for JSON output
          echo "nixos-configs<<EOF" >> $GITHUB_OUTPUT
          echo "$NIXOS_CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "nixos-count=$NIXOS_COUNT" >> $GITHUB_OUTPUT
          echo "NixOS configurations ($NIXOS_COUNT): $NIXOS_CONFIGS"
      - name: Check which configs changed
        id: check-changes
        env:
          DARWIN_CONFIGS: ${{ steps.discover.outputs.darwin-configs }}
          NIXOS_CONFIGS: ${{ steps.discover.outputs.nixos-configs }}
        run: bash .github/scripts/check-config-changes.sh
      # Always save drv hashes so iterative PR commits can skip unchanged configs.
      # Uses if: always() so the cache is saved even if downstream jobs fail.
      - name: Save derivation cache
        if: always() && steps.check-changes.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .drv-cache
          key: drv-${{ github.ref }}-${{ github.sha }}
  # Build all Darwin configurations that changed
  build-darwin:
    name: Build Darwin - ${{ matrix.config }}
    needs: discover-targets
    runs-on: macos-latest
    if: ${{ needs.discover-targets.outputs.darwin-changed != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover-targets.outputs.darwin-changed) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Build ${{ matrix.config }}
        id: build
        run: |
          echo "Building Darwin configuration: ${{ matrix.config }}"
          if nix build .#darwinConfigurations.${{ matrix.config }}.system \
              --dry-run --quiet 2>&1; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✓ Build plan validated"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "✗ Build failed"
            exit 1
          fi
  # Build all NixOS configurations that changed (x86_64)
  build-nixos:
    name: Build NixOS - ${{ matrix.config }}
    needs: discover-targets
    runs-on: ubuntu-latest
    if: ${{ needs.discover-targets.outputs.nixos-changed != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover-targets.outputs.nixos-changed) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Build ${{ matrix.config }}
        id: build
        run: |
          echo "Building NixOS configuration: ${{ matrix.config }}"
          # Use --impure to allow reading /etc/nixos/facter.json
          if nix build .#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel \
              --dry-run --quiet --impure 2>&1; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✓ Build plan validated"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "✗ Build failed"
            exit 1
          fi
  # Build all ARM NixOS configurations on native ARM runners
  build-nixos-arm:
    name: Build NixOS (ARM) - ${{ matrix.config }}
    needs: discover-targets
    runs-on: ubuntu-24.04-arm
    if: ${{ needs.discover-targets.outputs.nixos-arm-changed != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.discover-targets.outputs.nixos-arm-changed) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Build ${{ matrix.config }}
        id: build
        run: |
          echo "Building NixOS ARM configuration: ${{ matrix.config }}"
          if nix build .#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel \
              --dry-run --quiet --impure 2>&1; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "✓ Build plan validated"
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "✗ Build failed"
            exit 1
          fi
  # Collect all build results and report
  build-report:
    name: Build Report
    runs-on: ubuntu-latest
    needs:
      - build-darwin
      - build-nixos
      - build-nixos-arm
      - discover-targets
      - discover-checks
      - test-and-validate
    if: always()
    steps:

      - name: Report build results
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" \
            >> $GITHUB_STEP_SUMMARY
          DARWIN_RESULT="${{ needs.build-darwin.result }}"
          NIXOS_RESULT="${{ needs.build-nixos.result }}"
          NIXOS_ARM_RESULT="${{ needs.build-nixos-arm.result }}"
          TEST_AND_VALIDATE_RESULT="${{ needs.test-and-validate.result }}"
          DARWIN_CHANGED='${{ needs.discover-targets.outputs.darwin-changed }}'
          NIXOS_CHANGED='${{ needs.discover-targets.outputs.nixos-changed }}'
          NIXOS_ARM_CHANGED='${{ needs.discover-targets.outputs.nixos-arm-changed }}'
          # Count configs
          DARWIN_TOTAL=$(echo '${{ needs.discover-targets.outputs.darwin-configs }}' \
            | jq 'length')
          NIXOS_TOTAL=$(echo '${{ needs.discover-targets.outputs.nixos-configs }}' \
            | jq 'length')
          DARWIN_CHANGED_COUNT=$(echo "$DARWIN_CHANGED" | jq 'length')
          NIXOS_CHANGED_COUNT=$(echo "$NIXOS_CHANGED" | jq 'length')
          NIXOS_ARM_CHANGED_COUNT=$(echo "$NIXOS_ARM_CHANGED" | jq 'length')
          SUMMARY="**Darwin:** $DARWIN_CHANGED_COUNT of $DARWIN_TOTAL"
          echo "$SUMMARY configs changed" >> $GITHUB_STEP_SUMMARY
          SUMMARY="**NixOS (x86_64):** $NIXOS_CHANGED_COUNT of $NIXOS_TOTAL"
          echo "$SUMMARY configs changed" >> $GITHUB_STEP_SUMMARY
          SUMMARY="**NixOS (ARM):** $NIXOS_ARM_CHANGED_COUNT of $NIXOS_TOTAL"
          echo "$SUMMARY configs changed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Report validation results
          echo "### Tests & Validation" >> $GITHUB_STEP_SUMMARY
          if [ "$TEST_AND_VALIDATE_RESULT" = "success" ]; then
            echo "✅ Tests and validation passed" >> $GITHUB_STEP_SUMMARY
          elif [ "$TEST_AND_VALIDATE_RESULT" = "skipped" ]; then
            echo "⏭️ Tests and validation skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests and validation failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DARWIN_CHANGED" = "[]" ] && [ "$NIXOS_CHANGED" = "[]" ]; then
            echo "✅ No configuration changes detected - all builds skipped" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          # Check all results
          ALL_SUCCESS=true
          if [ "$DARWIN_RESULT" != "success" ] && [ "$DARWIN_RESULT" != "skipped" ]; then
            echo "❌ Darwin builds failed" >> $GITHUB_STEP_SUMMARY
            ALL_SUCCESS=false
          fi
          if [ "$NIXOS_RESULT" != "success" ] && [ "$NIXOS_RESULT" != "skipped" ]; then
            echo "❌ NixOS (x86_64) builds failed" >> $GITHUB_STEP_SUMMARY
            ALL_SUCCESS=false
          fi
          if [ "$NIXOS_ARM_RESULT" != "success" ] && [ "$NIXOS_ARM_RESULT" != "skipped" ]; then
            echo "❌ NixOS (ARM) builds failed" >> $GITHUB_STEP_SUMMARY
            ALL_SUCCESS=false
          fi
          if [ "$TEST_AND_VALIDATE_RESULT" != "success" ] \
            && [ "$TEST_AND_VALIDATE_RESULT" != "skipped" ]; then
            echo "❌ Tests and validation failed" >> $GITHUB_STEP_SUMMARY
            ALL_SUCCESS=false
          fi
          if [ "$ALL_SUCCESS" = "true" ]; then
            echo "✅ All builds and tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            exit 1
          fi
  # Discover the check list once. The devenv task emits the matrix consumed by
  # the bounded-concurrency check jobs below.
  discover-checks:
    name: Discover PR Check Matrix
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: ${{ needs.changes.outputs.check-prefixes != '[]' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Install devenv CLI from the locked project flake
        run: |
          DEVENV_REV=$(jq -r '.nodes.devenv.locked.rev' flake.lock)
          nix profile add --accept-flake-config "github:cachix/devenv/${DEVENV_REV}#devenv"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Validate Disko configuration
        run: >-
          nix build .#nixosConfigurations.zero.config.system.build.diskoScript
          --no-link --dry-run --quiet
      - name: Validate installation script
        run: bash -n scripts/install-machine.sh && test -x scripts/install-machine.sh
      - name: Plan changed PR checks
        id: plan
        env:
          CHECK_PREFIXES: ${{ needs.changes.outputs.check-prefixes }}
        run: |
          input=$(jq -cn --argjson prefixes "$CHECK_PREFIXES" \
            '{batchSize:4,checkPrefixes:$prefixes}')
          devenv tasks run ci:checks:changed-plan --input-json "$input"

  # VM checks require KVM and remain independent of the non-VM matrix.
  vm-tests:
    name: NixOS VM Checks
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: >
      ${{
        needs.changes.outputs.nix-files == 'true' ||
        needs.changes.outputs.workflows == 'true'
      }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Hestia Nix Cache
        uses: Mic92/hestia/action@v3.1.0
        with:
          upstream-cache-filter: true
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Install devenv CLI from the locked project flake
        run: |
          DEVENV_REV=$(jq -r '.nodes.devenv.locked.rev' flake.lock)
          nix profile add --accept-flake-config "github:cachix/devenv/${DEVENV_REV}#devenv"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Run VM smoke checks
        run: devenv tasks run ci:checks:vm-pr

  # Each matrix runner builds four checks with max-jobs=2; only the workflow
  # fans out aggressively, avoiding extra build pressure on individual runners.
  test-and-validate:
    name: Tests & Validation (${{ join(matrix.checks, ', ') }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, changes, discover-checks]
    if: >
      ${{
        needs.changes.outputs.check-prefixes != '[]' &&
        needs.discover-checks.outputs.matrix != ''
      }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover-checks.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Hestia Nix Cache
        uses: Mic92/hestia/action@v3.1.0
        with:
          upstream-cache-filter: true
      - name: Cachix (read-only)
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          skipPush: true
      - name: Install devenv CLI from the locked project flake
        run: |
          DEVENV_REV=$(jq -r '.nodes.devenv.locked.rev' flake.lock)
          nix profile add --accept-flake-config "github:cachix/devenv/${DEVENV_REV}#devenv"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Build changed check shard
        run: devenv tasks run ci:checks:changed-shard --input-json '${{ toJSON(matrix) }}'
