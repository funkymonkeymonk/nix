---
name: Main Branch Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  NIX_ACCESS_TOKENS: >-
    github.com=${{ github.token }} api.github.com=${{ github.token }}
    codeload.github.com=${{ github.token }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-darwin:
    name: Build Darwin Configurations
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Discover Darwin configurations
        id: discover
        run: |
          echo "Discovering Darwin configurations..."
          CONFIGS=$(nix eval .#darwinConfigurations \
            --apply 'x: builtins.attrNames x' --json 2>/dev/null || echo '[]')
          # Use multi-line syntax for GitHub Actions output to handle JSON properly
          echo "configs<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found Darwin configurations: $CONFIGS"
      - name: Build Darwin configurations (push to Cachix)
        run: |
          set -euo pipefail
          echo "Building Darwin configurations and pushing to Cachix..."
          CONFIGS='${{ steps.discover.outputs.configs }}'
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(".#darwinConfigurations.$config.system")
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No Darwin configurations found"
            exit 1
          fi
          echo "Building ${#installables[@]} Darwin configurations in one Nix invocation"
          nix build --no-link --max-jobs auto "${installables[@]}"
          echo "All Darwin configurations built and pushed to Cachix"
  build-linux:
    name: Build Linux Configurations
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Discover NixOS configurations
        id: discover
        run: |
          echo "Discovering NixOS configurations..."
          # Installer images are built by build-iso; ARM configs run natively.
          ALL_CONFIGS=$(nix eval --impure .#nixosConfigurations \
            --apply 'x: builtins.attrNames x' --json 2>/dev/null || echo '[]')
          # ARM configs build on native ARM runners; x86_64 on ubuntu-latest
          ARM_CONFIGS=$(echo "$ALL_CONFIGS" | jq \
            '[.[] | select(test("^installer-") | not)
                  | select(test("-arm(-|$)"))]')
          CONFIGS=$(echo "$ALL_CONFIGS" | jq \
            '[.[] | select(test("^installer-") | not)
                  | select(test("-arm(-|$)") | not)]')
          echo "configs<<EOF" >> $GITHUB_OUTPUT
          echo "$CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "arm-configs<<EOF" >> $GITHUB_OUTPUT
          echo "$ARM_CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found NixOS configurations (x86_64): $CONFIGS"
          echo "Found NixOS configurations (ARM): $ARM_CONFIGS"
      - name: Build Linux configurations (push to Cachix)
        id: build
        run: |
          set -euo pipefail
          echo "Building NixOS configurations and pushing to Cachix..."
          CONFIGS='${{ steps.discover.outputs.configs }}'
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(
              ".#nixosConfigurations.$config.config.system.build.toplevel"
            )
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No x86_64 NixOS configurations found"
            exit 1
          fi
          echo "Building ${#installables[@]} x86_64 NixOS configurations in one Nix invocation"
          nix build --no-link --impure --max-jobs auto "${installables[@]}"
          echo "built=${#installables[@]}" >> "$GITHUB_OUTPUT"
          echo "failed=0" >> "$GITHUB_OUTPUT"
          echo "All NixOS configurations built and pushed to Cachix"
  build-linux-arm:
    name: Build ARM Linux Configurations
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Discover ARM NixOS configurations
        id: discover
        run: |
          echo "Discovering ARM NixOS configurations..."
          ALL_CONFIGS=$(nix eval --impure .#nixosConfigurations \
            --apply 'x: builtins.attrNames x' --json 2>/dev/null || echo '[]')
          ARM_CONFIGS=$(echo "$ALL_CONFIGS" | jq \
            '[.[] | select(test("-arm(-|$)"))]')
          echo "arm-configs<<EOF" >> $GITHUB_OUTPUT
          echo "$ARM_CONFIGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found ARM NixOS configurations: $ARM_CONFIGS"
      - name: Build ARM Linux configurations (push to Cachix)
        id: build
        run: |
          set -euo pipefail
          echo "Building ARM NixOS configurations and pushing to Cachix..."
          CONFIGS='${{ steps.discover.outputs.arm-configs }}'
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(
              ".#nixosConfigurations.$config.config.system.build.toplevel"
            )
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No ARM NixOS configurations found"
            exit 1
          fi
          echo "Building ${#installables[@]} ARM NixOS configurations in one Nix invocation"
          nix build --no-link --impure --max-jobs auto "${installables[@]}"
          echo "built=${#installables[@]}" >> "$GITHUB_OUTPUT"
          echo "failed=0" >> "$GITHUB_OUTPUT"
          echo "All ARM NixOS configurations built and pushed to Cachix"
  cache-health:
    name: Verify Cache Population
    runs-on: ubuntu-latest
    needs: [build-darwin, build-linux, build-linux-arm]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "## Cache Population Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          DARWIN="${{ needs.build-darwin.result }}"
          LINUX="${{ needs.build-linux.result }}"
          LINUX_ARM="${{ needs.build-linux-arm.result }}"

          if [ "$DARWIN" = "success" ]; then
            echo "- Darwin builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Darwin builds: **FAILED** ($DARWIN)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$LINUX" = "success" ]; then
            echo "- NixOS (x86_64) builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NixOS (x86_64) builds: **FAILED** ($LINUX)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$LINUX_ARM" = "success" ]; then
            echo "- NixOS (ARM) builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NixOS (ARM) builds: **FAILED** ($LINUX_ARM)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DARWIN" != "success" ] \
             || [ "$LINUX" != "success" ] \
             || [ "$LINUX_ARM" != "success" ]; then
            echo "**Cache is stale.** Local deploys may need to build from source." \
              >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "::warning::Cache population incomplete - some builds failed"
            exit 1
          else
            echo "Cache is up-to-date for all configurations." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
