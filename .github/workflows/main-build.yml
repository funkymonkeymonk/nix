---
name: Main Branch Build
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-rebuild:
        description: Build and republish every discovered configuration
        type: boolean
        default: false
env:
  NIX_ACCESS_TOKENS: >-
    github.com=${{ github.token }} api.github.com=${{ github.token }}
    codeload.github.com=${{ github.token }}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover-targets:
    name: Discover Changed Configurations
    runs-on: ubuntu-24.04
    outputs:
      darwin-changed: ${{ steps.check-changes.outputs.darwin-changed }}
      nixos-changed: ${{ steps.check-changes.outputs.nixos-changed }}
      nixos-arm-changed: ${{ steps.check-changes.outputs.nixos-arm-changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            download-attempts = 10
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Restore successful derivation cache
        uses: actions/cache/restore@v5
        with:
          path: .drv-cache
          key: main-build-drv-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            main-build-drv-
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Discover configurations
        id: discover
        run: |
          set -euo pipefail
          darwin=$(nix eval .#darwinConfigurations \
            --apply 'x: builtins.attrNames x' --json | jq -c .)
          # Installer images are built separately, except ARM targets which
          # retain their existing native build behavior.
          nixos=$(nix eval --impure .#nixosConfigurations \
            --apply 'x: builtins.attrNames x' --json | jq -c \
            '[.[] | select((test("^installer-") | not) or test("-arm(-|$)"))]')
          echo "darwin-configs=$darwin" >> "$GITHUB_OUTPUT"
          echo "nixos-configs=$nixos" >> "$GITHUB_OUTPUT"
      - name: Check which configs changed
        id: check-changes
        env:
          DARWIN_CONFIGS: ${{ steps.discover.outputs.darwin-configs }}
          FORCE_REBUILD: ${{ inputs.force-rebuild || false }}
          NIXOS_CONFIGS: ${{ steps.discover.outputs.nixos-configs }}
        run: bash .github/scripts/check-config-changes.sh
      # This is only a candidate. Publish it as a cache after builds succeed.
      - name: Package candidate derivation cache
        run: tar -cf drv-cache.tar .drv-cache
      - name: Upload candidate derivation cache
        uses: actions/upload-artifact@v6
        with:
          name: main-build-drv-candidate
          path: drv-cache.tar
          if-no-files-found: error
          retention-days: 1
  build-darwin:
    name: Build Darwin Configurations
    needs: [discover-targets]
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            download-attempts = 10
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Build Darwin configurations (push to Cachix)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${CACHIX_AUTH_TOKEN:?Cachix push credential required}"
          echo "Building Darwin configurations and pushing to Cachix..."
          CONFIGS='${{ needs.discover-targets.outputs.darwin-changed }}'
          if ! jq -e -s 'length == 1 and (.[0] | type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$")))' \
            <<< "$CONFIGS" > /dev/null; then
            echo "Invalid Darwin configuration selection" >&2
            exit 1
          fi
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(".#darwinConfigurations.$config.system")
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No changed Darwin configurations to build"
            exit 0
          fi
          echo "Building ${#installables[@]} Darwin configurations in one Nix invocation"
          nix build --no-link --print-out-paths --max-jobs auto "${installables[@]}" |
            cachix push funkymonkeymonk
          echo "All Darwin configurations built and pushed to Cachix"
  build-linux:
    name: Build Linux Configurations
    needs: [discover-targets]
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            download-attempts = 10
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Build Linux configurations (push to Cachix)
        id: build
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${CACHIX_AUTH_TOKEN:?Cachix push credential required}"
          echo "Building NixOS configurations and pushing to Cachix..."
          CONFIGS='${{ needs.discover-targets.outputs.nixos-changed }}'
          if ! jq -e -s 'length == 1 and (.[0] | type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$")))' \
            <<< "$CONFIGS" > /dev/null; then
            echo "Invalid x86_64 NixOS configuration selection" >&2
            exit 1
          fi
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(
              ".#nixosConfigurations.$config.config.system.build.toplevel"
            )
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No changed x86_64 NixOS configurations to build"
            exit 0
          fi
          echo "Building ${#installables[@]} x86_64 NixOS configurations in one Nix invocation"
          nix build --no-link --print-out-paths --impure --max-jobs auto "${installables[@]}" |
            cachix push funkymonkeymonk
          echo "built=${#installables[@]}" >> "$GITHUB_OUTPUT"
          echo "failed=0" >> "$GITHUB_OUTPUT"
          echo "All NixOS configurations built and pushed to Cachix"
  build-linux-arm:
    name: Build ARM Linux Configurations
    needs: [discover-targets]
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            download-attempts = 10
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          skipPush: true
      - name: Build ARM Linux configurations (push to Cachix)
        id: build
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${CACHIX_AUTH_TOKEN:?Cachix push credential required}"
          echo "Building ARM NixOS configurations and pushing to Cachix..."
          CONFIGS='${{ needs.discover-targets.outputs.nixos-arm-changed }}'
          if ! jq -e -s 'length == 1 and (.[0] | type == "array" and
            all(.[]; type == "string" and test("^[A-Za-z0-9_-]+$")))' \
            <<< "$CONFIGS" > /dev/null; then
            echo "Invalid ARM NixOS configuration selection" >&2
            exit 1
          fi
          installables=()
          while IFS= read -r config; do
            [[ -z "$config" ]] || installables+=(
              ".#nixosConfigurations.$config.config.system.build.toplevel"
            )
          done < <(echo "$CONFIGS" | jq -r '.[]')
          if ((${#installables[@]} == 0)); then
            echo "No changed ARM NixOS configurations to build"
            exit 0
          fi
          echo "Building ${#installables[@]} ARM NixOS configurations in one Nix invocation"
          nix build --no-link --print-out-paths --impure --max-jobs auto "${installables[@]}" |
            cachix push funkymonkeymonk
          echo "built=${#installables[@]}" >> "$GITHUB_OUTPUT"
          echo "failed=0" >> "$GITHUB_OUTPUT"
          echo "All ARM NixOS configurations built and pushed to Cachix"
  cache-health:
    name: Verify Cache Population
    runs-on: ubuntu-24.04
    needs: [discover-targets, build-darwin, build-linux, build-linux-arm]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "## Cache Population Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          DARWIN="${{ needs.build-darwin.result }}"
          LINUX="${{ needs.build-linux.result }}"
          LINUX_ARM="${{ needs.build-linux-arm.result }}"

          if [ "$DARWIN" = "success" ]; then
            echo "- Darwin builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Darwin builds: **FAILED** ($DARWIN)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$LINUX" = "success" ]; then
            echo "- NixOS (x86_64) builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NixOS (x86_64) builds: **FAILED** ($LINUX)" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$LINUX_ARM" = "success" ]; then
            echo "- NixOS (ARM) builds: pushed to Cachix" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- NixOS (ARM) builds: **FAILED** ($LINUX_ARM)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$DARWIN" != "success" ] \
             || [ "$LINUX" != "success" ] \
             || [ "$LINUX_ARM" != "success" ]; then
            echo "**Cache is stale.** Local deploys may need to build from source." \
              >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "::warning::Cache population incomplete - some builds failed"
            exit 1
          else
            echo "Cache is up-to-date for all configurations." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download candidate derivation cache
        if: >-
          success() && needs.discover-targets.result == 'success' &&
          needs.build-darwin.result == 'success' && needs.build-linux.result == 'success' &&
          needs.build-linux-arm.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: main-build-drv-candidate
      - name: Unpack candidate derivation cache
        run: tar -xf drv-cache.tar
      - name: Save successful derivation cache
        if: >-
          success() && needs.discover-targets.result == 'success' &&
          needs.build-darwin.result == 'success' && needs.build-linux.result == 'success' &&
          needs.build-linux-arm.result == 'success'
        uses: actions/cache/save@v5
        with:
          path: .drv-cache
          key: main-build-drv-${{ github.run_id }}-${{ github.run_attempt }}
  full-test-suite:
    name: Full Test Suite
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = false
            download-attempts = 10
            access-tokens = ${{ env.NIX_ACCESS_TOKENS }}
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: funkymonkeymonk
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Create stub facter.json
        run: bash .github/scripts/create-facter-stub.sh
      - name: Run the complete test suite without the Devenv package profile
        run: |
          set -euo pipefail
          bash tests/test-platform-deprecation-warnings.sh
          bash tests/test-machine-chart.sh
          nix flake check --max-jobs auto
